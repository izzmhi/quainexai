[project]
name = "quainex"
version = "0.1.0"
description = "Quainex — Your Personal AI Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anthropic>=0.40",
    # --- Phase 3: desktop automation ---
    "psutil>=6.1",      # process inspection/termination, system metrics
    "pillow>=11.0",     # screen capture via ImageGrab
    "pyperclip>=1.9",   # clipboard read/write
    # --- Phase 4: voice ---
    "python-multipart>=0.0.20",  # audio file uploads to /voice/transcribe
    # --- Phase 5: memory ---
    "sqlalchemy>=2.0",  # ORM over SQLite now, PostgreSQL later
    "aiosqlite>=0.20",  # async SQLite driver
]

[project.optional-dependencies]
# Speech-to-text and microphone capture. Kept OPTIONAL because Whisper model
# weights are hundreds of megabytes and this machine has a history of stalling
# large CDN transfers. Quainex boots and works by text without any of it; the
# voice subsystem reports itself unavailable instead of failing to start.
#   pip install -e ".[voice]"
voice = [
    "faster-whisper>=1.1",  # CTranslate2 Whisper — far lighter than torch
    "sounddevice>=0.5",     # microphone capture via PortAudio
    "numpy>=2.0",           # audio buffers
]
# Webcam capture. pygrabber drives DirectShow through comtypes — small, pure
# Python — rather than OpenCV, whose ~40 MB wheel this machine's flaky downloads
# do not survive. Pillow (already a base dependency, for screenshots) encodes.
#   pip install -e ".[camera]"
camera = [
    "pygrabber>=0.2",  # DirectShow webcam frames
    "numpy>=2.0",      # frame buffers
]
# Exact volume control. pycaw wraps the Core Audio COM interface; comtypes is
# already pulled by the camera extra. Without it, up/down/mute still work via the
# media keys — only an exact percentage needs this.
#   pip install -e ".[audio]"
audio = [
    "pycaw>=20240210",  # IAudioEndpointVolume, for set-to-a-percentage
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-psutil>=6.1",
]

[project.scripts]
quainex = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quainex*"]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (modern syntax)
    "ANN",  # flake8-annotations (type hints required)
    "D",    # pydocstyle (docstrings required)
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",  # allow `Any` where genuinely unavoidable
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names, and fixtures like `tmp_path`
# carry well-known types. Enforcing docstrings and annotations here adds noise
# without adding safety — production code keeps the full rule set.
# S105/S106 flag string literals that look like credentials; in tests they are
# deliberately fake fixtures, and several exist precisely to prove a bad
# credential is rejected. SLF001 covers reaching into internals to build an
# already-expired token.
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "SLF001", "D1", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# These ship no type stubs and have no types-* packages. Each is reached through
# a Protocol boundary, so the untyped surface is confined to one adapter module.
[[tool.mypy.overrides]]
module = ["pyperclip", "faster_whisper", "sounddevice", "pygrabber", "pygrabber.*", "pycaw", "pycaw.*"]
ignore_missing_imports = true

# pygrabber's classes carry no annotations, so every call reads as untyped. The
# surface is confined to webcam.py, one adapter behind the DesktopController
# Protocol — the same containment the other untyped libraries get.
[[tool.mypy.overrides]]
module = "quainex.core.automation.webcam"
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
