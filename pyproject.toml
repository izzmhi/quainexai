[project]
name = "quainex"
version = "0.1.0"
description = "Quainex — Your Personal AI Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anthropic>=0.40",
    # --- Phase 3: desktop automation ---
    "psutil>=6.1",      # process inspection/termination, system metrics
    "pillow>=11.0",     # screen capture via ImageGrab
    "pyperclip>=1.9",   # clipboard read/write
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-psutil>=6.1",
]

[project.scripts]
quainex = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quainex*"]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (modern syntax)
    "ANN",  # flake8-annotations (type hints required)
    "D",    # pydocstyle (docstrings required)
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",  # allow `Any` where genuinely unavoidable
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names, and fixtures like `tmp_path`
# carry well-known types. Enforcing docstrings and annotations here adds noise
# without adding safety — production code keeps the full rule set.
"tests/*" = ["S101", "D1", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pyperclip ships no type stubs and has no types-* package.
[[tool.mypy.overrides]]
module = "pyperclip"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
